name: Compétitions bonus (supercoupes, coupes, Ligue des Nations)

on:
  schedule:
    # 2 fois par jour seulement, pour rester très large sous le quota de
    # 100 requêtes/jour du plan gratuit API-Football.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Récupérer les compétitions bonus
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/fetch_extra_competitions.py

      - name: Publier les changements si nécessaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/extra_competitions.json data/extra_league_ids_cache.json
          git diff --quiet --cached || git commit -m "Mise à jour des compétitions bonus"
          git push || (git pull --rebase origin main && git push)
